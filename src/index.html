<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>Firmeza - Gestión & Comercial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('firmeza-theme');
        var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="512x512" href="img/favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/favicon.png">
</head>
<body class="min-h-screen bg-[#eef3fb] dark:bg-[#05070b] text-[#0d1424] dark:text-[#f4f6fb] antialiased">
  <app-root>Cargando Firmeza...</app-root>
</body>
</html>
